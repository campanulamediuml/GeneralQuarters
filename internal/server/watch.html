<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>观战 · General Quarters</title>
<style>
  :root{--bg:#091418;--panel:#101f24;--line:#294047;--muted:#829a9c;--gold:#d7bb7b;--a:#5eb5c8;--b:#d77c6c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,#16303988,transparent 42%),var(--bg);color:#dce7e3;font:13px/1.5 system-ui,-apple-system,'Noto Sans SC',sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 20px;border-bottom:1px solid var(--line);background:#0d1d22}
  .kicker{font-size:10px;letter-spacing:2.4px;color:var(--gold)}
  h1{margin:3px 0 0;font-size:19px;font-weight:600;letter-spacing:1px}
  .stats{display:flex;align-items:flex-end;gap:18px}
  .stats div{text-align:right;line-height:1.15}
  .stats b{display:block;font-size:20px;color:#e5ddc8;font-variant-numeric:tabular-nums}
  .stats span{font-size:10px;color:var(--muted)}
  .status{padding:5px 10px;border:1px solid var(--line);border-radius:2px;font-size:11px;color:var(--muted)}
  .status.running{color:#8fd8b4;border-color:#3d6a58}
  .status.finished{color:var(--gold);border-color:#6a5a34}
  main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;padding:14px 18px 20px;max-width:2000px;margin:0 auto}
  .map-wrap{position:relative;background:#0b1b20;border:1px solid #2c4248;padding:6px;overflow:hidden;min-height:520px}
  svg#map{display:block;width:100%;height:auto;cursor:grab;touch-action:none;user-select:none}
  svg#map.dragging{cursor:grabbing}
  .map-tools{position:absolute;right:10px;top:10px;display:flex;gap:5px;z-index:5}
  .map-tools button{min-width:30px;height:27px;padding:0 8px;border:1px solid var(--line);background:#10252b;color:#dce7e3;font:600 12px/1 system-ui;cursor:pointer;border-radius:2px}
  .map-tools button:hover{border-color:var(--gold);color:var(--gold)}
  .map-tools button:disabled{opacity:.35;cursor:default;border-color:var(--line);color:var(--muted)}
  .map-tools #zoom-value{min-width:52px;font-size:11px;color:#c8d8d4}
  .map-hint{position:absolute;left:12px;bottom:8px;color:#5f7e86;font-size:10px;pointer-events:none;z-index:5}
  .detail-panel{position:absolute;right:10px;top:44px;z-index:12;width:min(390px,calc(100% - 20px));max-height:calc(100% - 58px);display:flex;flex-direction:column;background:#0d1d22f7;border:1px solid #526b73;box-shadow:0 14px 40px #000a;color:#dce7e3}
  .detail-panel[hidden]{display:none}
  .detail-panel>header{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid #2c4248}
  .detail-panel header span{display:block;color:var(--gold);font-size:9px;letter-spacing:1.8px}
  .detail-panel h2{margin:3px 0 0;font-size:15px;font-weight:600}
  .detail-panel header button{border:0;background:transparent;color:#8fa7a8;font-size:20px;line-height:1;padding:0 2px}
  .detail-panel header button:hover{color:var(--gold)}
  .detail-meta{display:flex;flex-wrap:wrap;gap:5px 12px;padding:7px 12px;border-bottom:1px solid #22383e;color:#8fa7a8;font-size:10px}
  .detail-meta b{color:#cfe0dc;font-weight:500}
  .detail-cards{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;overflow:auto}
  .detail-card{display:flex;align-items:center;gap:7px;min-width:0;padding:5px;border:1px solid #314b53;background:#12252b}
  .detail-card img{width:56px;height:34px;object-fit:contain;flex:none;background:transparent;border:0}
  .detail-card img.ship-pic{filter:brightness(0) invert(1);opacity:.9}
  .detail-card .detail-copy{min-width:0;line-height:1.35}
  .detail-card b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:#dce7e3}
  .detail-card small{display:block;color:#809a9d;font-size:9px}
  .detail-card em{display:inline-block;margin-top:2px;color:#d7bb7b;font-style:normal;font-size:9px}
  .detail-card .detail-pic-fallback{width:56px;height:34px;display:grid;place-items:center;flex:none;border:1px solid #20343a;background:#0a181d;color:#6f8d92;font-size:9px}
  .detail-empty{padding:18px 12px;color:#718d91;font-size:11px}
  .fleet-ship,.fleet-label,.watch-air{cursor:pointer}
  /* 牌子到舰影的归属线：细红虚线，不吃点击。 */
  .fleet-tether{stroke:#ff6b5e;stroke-width:1;stroke-opacity:.55;stroke-dasharray:3 2;fill:none;pointer-events:none}
  @media(max-width:600px){.detail-cards{grid-template-columns:1fr}.detail-panel{top:38px}}
  .hex{fill:#102830;stroke:#34505a;stroke-width:.7}
  /* 天气图案：云朵=多云、水滴=降雨、闪电=风暴。压在最上层，但不吃点击。 */
  .wx-icon{fill:#cfe0e8;fill-opacity:.40;pointer-events:none}
  .wx-icon.weather-2{fill-opacity:.52}
  .wx-icon.weather-3{fill-opacity:.58}
  .map-legend{position:absolute;left:12px;bottom:26px;display:flex;gap:12px;align-items:center;z-index:5;color:#7f9aa0;font-size:10px;pointer-events:none}
  .map-legend span{display:flex;align-items:center;gap:4px}
  .map-legend svg{width:13px;height:13px;fill:#cfe0e8;fill-opacity:.75}
  /* 格底风向箭头：指向"风吹向"，只做提示。 */
  .wind-arrow{fill:none;stroke:#7fa6b0;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;opacity:.55;pointer-events:none}
  .hex.island{fill:#34463e;stroke:#6b8066}
  .hex.shoal{fill:#173c42;stroke:#4b7775;stroke-dasharray:3 2}
  .hex.reef{fill:#273137;stroke:#7e6f67;stroke-dasharray:2 2}
  .recon-sector .recon-cell{pointer-events:none}
  .recon-sector .recon-cell.current{stroke-linejoin:round}
  #distance,#distance-labels{pointer-events:none}
  .distance-ring{fill:none;stroke:#79d4df;stroke-width:1.1;stroke-opacity:.3;stroke-dasharray:3 4;stroke-linecap:round}
  .distance-ring-label circle{fill:#07171bdd;stroke:#79d4df;stroke-width:1;stroke-opacity:.75}
  .distance-ring-label text{fill:#d7f7ff;font-weight:700}
  .distance-origin-marker{fill:#f0d792;stroke:#071417;stroke-width:1}
  aside{display:flex;flex-direction:column;gap:12px;min-width:0}
  .card{background:var(--panel);border:1px solid #2a4148;padding:10px 12px}
  .card h2{margin:0 0 8px;font-size:11px;letter-spacing:1.6px;color:var(--gold);font-weight:600}
  .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-top:1px solid #1d3238;font-size:12px}
  .row:first-child{border-top:0}
  .row small{color:var(--muted);font-size:10px}
  .briefing{margin:0 0 8px;border:1px solid #2a4148;background:#0b1c21}
  .briefing summary{padding:7px 9px;color:var(--gold);font-size:11px;cursor:pointer}
  .briefing div{padding:0 10px 9px;color:#a9bcba;font-size:11px;line-height:1.75;white-space:pre-line}
  .outcome-reason{padding:4px 0 2px;color:var(--muted);font-size:10px;line-height:1.55}
  .tag{display:inline-block;min-width:16px;text-align:center;font-size:10px;font-weight:700;color:#0b1b20;border-radius:2px;padding:0 4px}
  .tag.a{background:var(--a)} .tag.b{background:var(--b)}
  .fleet-line{display:flex;align-items:center;gap:7px;padding:4px 0;border-top:1px solid #1d3238;font-size:12px}
  .fleet-line:first-child{border-top:0}
  .fleet-line .coord{color:#9fc4cb;font-variant-numeric:tabular-nums}
  .fleet-line .meta{margin-left:auto;color:var(--muted);font-size:10px;white-space:nowrap}
  .event-list{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto}
  .event-list li{display:flex;gap:8px;padding:4px 0;border-top:1px solid #1d3238;font-size:11px;color:#a9bfbb;line-height:1.45}
  .event-list li:first-child{border-top:0}
  .event-list time{color:#5f7e86;font-variant-numeric:tabular-nums;flex:none}
  footer{padding:10px 20px;color:#5f7e86;font-size:11px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .empty{color:#5f7e86;font-size:11px;padding:4px 0}
  .err{color:#e59889;font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <div class="kicker">GENERAL QUARTERS · SPECTATOR</div>
    <h1 id="scenario">正在连接…</h1>
  </div>
  <div class="stats">
    <div><b id="turn">–</b><span>回合</span></div>
    <div><b id="clock">–</b><span>剧本时间</span></div>
    <div id="status" class="status">连接中</div>
  </div>
</header>
<main>
  <section class="map-wrap">
    <div class="map-tools">
      <button id="zoom-out" type="button" title="缩小" aria-label="缩小地图">−</button>
      <button id="zoom-value" type="button" title="复位到全图" aria-label="地图缩放复位">100%</button>
      <button id="zoom-in" type="button" title="放大" aria-label="放大地图">+</button>
    </div>
    <div class="map-legend">
      <span><svg viewBox="-10 -10 20 20" aria-hidden="true"><circle cx="-5.4" cy="1.4" r="3.4" /><circle cx="-0.6" cy="-1.2" r="4.8" /><circle cx="3.6" cy="1.2" r="3.2" /><rect x="-8.6" y="1.2" width="12.8" height="3.6" rx="1.8" /></svg>多云</span>
      <span><svg viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0 -7.4c0 0 3.2 4.8 3.2 7a3.2 3.2 0 0 1-6.4 0c0-2.2 3.2-7 3.2-7Z" /><path transform="translate(-7.6 4.2) scale(.76)" d="M0 -7.4c0 0 3.2 4.8 3.2 7a3.2 3.2 0 0 1-6.4 0c0-2.2 3.2-7 3.2-7Z" /><path transform="translate(7.6 4.2) scale(.76)" d="M0 -7.4c0 0 3.2 4.8 3.2 7a3.2 3.2 0 0 1-6.4 0c0-2.2 3.2-7 3.2-7Z" /></svg>降雨</span>
      <span><svg viewBox="-10 -10 20 20" aria-hidden="true"><path d="M1.6 -9.6 L-5.6 0.9 H-1.4 L-2.4 9.6 L6 -1.2 H1.4 L4.8 -9.6 Z" /></svg>风暴</span>
    </div>
    <div class="map-hint">拖动地图平移 · ＋/－缩放 · 点兵牌看编成/距离 · Esc 清除</div>
    <div id="detail-panel" class="detail-panel" hidden>
      <header>
        <div><span id="detail-kicker">FORMATION</span><h2 id="detail-title">编队详情</h2></div>
        <button id="detail-close" type="button" aria-label="关闭详情">×</button>
      </header>
      <div id="detail-meta" class="detail-meta"></div>
      <div id="detail-cards" class="detail-cards"></div>
    </div>
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  </section>
  <aside>
    <section class="card"><h2>战况</h2><div id="summary"><div class="empty">等待第一次刷新…</div></div></section>
    <section class="card"><h2>舰队</h2><div id="fleets"></div></section>
    <section class="card"><h2>航母作业</h2><div id="carriers"></div></section>
    <section class="card"><h2>战报</h2><ol class="event-list" id="events"></ol></section>
  </aside>
</main>
<footer>
  <span id="updated">–</span>
  <span id="room">–</span>
</footer>
<script>
(function () {
  'use strict';
  var SIZE = 17;
  var MAP_WIDTH = 0;
  var MAP_HEIGHT = 0;
  var FULL_VIEW = null;
  var VIEW = null;
  var MAP_ROWS = 0;
  var MAP_COLS = 0;
  var DISTANCE_ORIGIN = '';
  var ZOOM_STEPS = [0.5, 0.6, 0.75, 1, 1.2, 1.5, 2, 2.5, 3, 4, 5];
  var zoomIndex = 3;
  var HEADING_ANGLE = { E: 0, SE: 60, SW: 120, W: 180, NW: 240, NE: 300 };
  var COLOR = { A: '#5aa9ff', B: '#ff6f61' };
  var AIRBORNE = { cap: 1, recon: 1, attack: 1, attack_holding: 1, cover: 1, transfer: 1 };
  // 在舰状态：这些才算占机库/甲板位置。升空在外的不占——它们返航时才要往下落。
  var ABOARD = { hangar: 1, service: 1, deck: 1, ready: 1, recovery: 1, elevator: 1 };
  var NS = 'http://www.w3.org/2000/svg';
  var parts = location.pathname.split('/').filter(Boolean);
  var room = parts[1] || '';
  // 主入口 /watch/{token}；兼容 /watch/{room}/{token} 与旧 query token。
  var token = parts[2] || new URLSearchParams(location.search).get('token') || parts[1] || '';
  var built = false;

  function el(name, attrs) {
    var node = document.createElementNS(NS, name);
    if (attrs) Object.keys(attrs).forEach(function (key) { node.setAttribute(key, attrs[key]); });
    return node;
  }
  function text(x, y, value, fill, size, weight, anchor) {
    var node = el('text', { x: x, y: y, fill: fill || '#dce7e3', 'font-size': size || 10, 'font-weight': weight || 400, 'text-anchor': anchor || 'start' });
    node.textContent = value;
    return node;
  }
  function center(coord) {
    var row = Number(coord.slice(0, 2));
    var col = Number(coord.slice(2, 4));
    return {
      x: Math.sqrt(3) * SIZE * (col - 0.5 + (row % 2 ? 0.5 : 0)),
      y: SIZE * (1.5 * (row - 1) + 1)
    };
  }
  function hexPoints(x, y) {
    var points = [];
    for (var i = 0; i < 6; i++) {
      var angle = Math.PI / 180 * (60 * i - 30);
      points.push((x + SIZE * Math.cos(angle)) + ',' + (y + SIZE * Math.sin(angle)));
    }
    return points.join(' ');
  }
  // 距离环是正六边形：六个顶点就是六个角上的数字位置，虚线只负责把它们连起来。
  function ringPath(origin, distance) {
    var radius = distance * Math.sqrt(3) * SIZE;
    var corners = [];
    for (var i = 0; i < 6; i++) {
      var angle = i * Math.PI / 3;
      corners.push((origin.x + radius * Math.cos(angle)) + ',' + (origin.y + radius * Math.sin(angle)));
    }
    return 'M' + corners.join(' L') + ' Z';
  }
  function pad(value) { return String(value).padStart ? String(value).padStart(2, '0') : ('0' + value).slice(-2); }

  function hexDistance(from, to) {
    function cube(coord) {
      var row = Number(coord.slice(0, 2)) - 1;
      var col = Number(coord.slice(2, 4)) - 1;
      var x = col - Math.floor((row + (row & 1)) / 2);
      var z = row;
      return [x, -x - z, z];
    }
    var a = cube(from);
    var b = cube(to);
    return Math.max(Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1]), Math.abs(a[2] - b[2]));
  }

  function clearDistance() {
    DISTANCE_ORIGIN = '';
    drawDistanceRings();
  }

  function selectDistance(coord) {
    DISTANCE_ORIGIN = coord || '';
    drawDistanceRings();
  }

  // 点击舰队/空中算子后，以它所在 hex 为中心画 2/4/6/8… 一直画到地图边缘。
  // 每圈一条淡虚线六边形，连接六个角上的距离数字。
  var LABEL_ANGLE_TOLERANCE = Math.PI / 180;
  function drawDistanceRings() {
    var cellsLayer = document.getElementById('distance');
    var labelsLayer = document.getElementById('distance-labels');
    if (!cellsLayer || !labelsLayer) return;
    cellsLayer.innerHTML = '';
    labelsLayer.innerHTML = '';
    if (!DISTANCE_ORIGIN || !MAP_ROWS || !MAP_COLS) return;
    var origin = center(DISTANCE_ORIGIN);
    var rings = {};
    for (var row = 1; row <= MAP_ROWS; row++) {
      for (var col = 1; col <= MAP_COLS; col++) {
        var coord = pad(row) + pad(col);
        var distance = hexDistance(DISTANCE_ORIGIN, coord);
        if (distance > 0 && distance % 2 === 0) {
          (rings[distance] = rings[distance] || []).push(coord);
        }
      }
    }
    function angleOf(coord) {
      var point = center(coord);
      return Math.atan2(point.y - origin.y, point.x - origin.x);
    }
    function angleGap(a, b) {
      var delta = Math.abs(a - b) % (Math.PI * 2);
      return delta > Math.PI ? Math.PI * 2 - delta : delta;
    }
    cellsLayer.appendChild(el('circle', { cx: origin.x, cy: origin.y, r: 4, class: 'distance-origin-marker' }));
    // 环的外轮廓是平顶六边形，六个角在 0°、60°、120°、180°、240°、300°。
    var cornerAngles = [0, Math.PI / 3, 2 * Math.PI / 3, Math.PI, 4 * Math.PI / 3, 5 * Math.PI / 3];
    Object.keys(rings).map(Number).sort(function (a, b) { return a - b; }).forEach(function (distance) {
      var ring = rings[distance].slice().sort(function (a, b) { return angleOf(a) - angleOf(b); });
      cellsLayer.appendChild(el('path', {
        d: ringPath(origin, distance),
        class: 'distance-ring',
        'data-distance': distance
      }));
      var used = {};
      cornerAngles.forEach(function (target) {
        var best = null;
        var bestGap = Infinity;
        ring.forEach(function (coord) {
          if (used[coord]) return;
          var gap = angleGap(angleOf(coord), target);
          if (gap < bestGap) {
            bestGap = gap;
            best = coord;
          }
        });
        if (!best || bestGap > LABEL_ANGLE_TOLERANCE) return;
        used[best] = true;
        var point = center(best);
        var badge = el('g', {
          class: 'distance-ring-label',
          transform: 'translate(' + point.x + ',' + point.y + ')',
          'data-distance-label': distance
        });
        badge.appendChild(el('circle', { r: 6.5 }));
        var label = text(0, 2.8, String(distance), '#d7f7ff', 8, 700, 'middle');
        badge.appendChild(label);
        labelsLayer.appendChild(badge);
      });
    });
  }

  function buildMap(map) {
    var svg = document.getElementById('map');
    var width = Math.sqrt(3) * SIZE * (map.cols + 0.5) + 20;
    var height = SIZE * (1.5 * (map.rows - 1) + 2) + 20;
    MAP_WIDTH = width;
    MAP_HEIGHT = height;
    MAP_ROWS = map.rows;
    MAP_COLS = map.cols;
    FULL_VIEW = { x: 0, y: 0, w: width, h: height };
    VIEW = { x: 0, y: 0, w: width, h: height };
    zoomIndex = ZOOM_STEPS.indexOf(1);
    applyView();
    updateZoomLabel();
    svg.innerHTML = '';
    // 天气图案符号：云朵 / 水滴 / 闪电，按 hex 半径 17 的坐标系画，格子里 1:1 使用。
    var defs = el('defs');
    defs.innerHTML = '<symbol id="wx-cloud" overflow="visible"><g><circle cx="-5.4" cy="1.4" r="3.4" /><circle cx="-0.6" cy="-1.2" r="4.8" /><circle cx="3.6" cy="1.2" r="3.2" /><rect x="-8.6" y="1.2" width="12.8" height="3.6" rx="1.8" /></g><g><circle cx="7.2" cy="-5.8" r="2.4" /><circle cx="9.8" cy="-4.6" r="1.8" /><rect x="4.6" y="-4.6" width="5.8" height="2.4" rx="1.2" /></g></symbol>'
      + '<symbol id="wx-rain" overflow="visible"><path d="M0 -7.4c0 0 3.2 4.8 3.2 7a3.2 3.2 0 0 1-6.4 0c0-2.2 3.2-7 3.2-7Z" /><path transform="translate(-7.6 4.2) scale(.76)" d="M0 -7.4c0 0 3.2 4.8 3.2 7a3.2 3.2 0 0 1-6.4 0c0-2.2 3.2-7 3.2-7Z" /><path transform="translate(7.6 4.2) scale(.76)" d="M0 -7.4c0 0 3.2 4.8 3.2 7a3.2 3.2 0 0 1-6.4 0c0-2.2 3.2-7 3.2-7Z" /></symbol>'
      + '<symbol id="wx-storm" overflow="visible"><path d="M1.6 -9.6 L-5.6 0.9 H-1.4 L-2.4 9.6 L6 -1.2 H1.4 L4.8 -9.6 Z" /></symbol>';
    svg.appendChild(defs);
    var terrain = {};
    (map.cells || []).forEach(function (cell) { terrain[cell.coord] = cell.terrain; });
    var layer = el('g');
    for (var row = 1; row <= map.rows; row++) {
      for (var col = 1; col <= map.cols; col++) {
        var coord = pad(row) + pad(col);
        var point = center(coord);
        layer.appendChild(el('polygon', { points: hexPoints(point.x, point.y), class: 'hex ' + (terrain[coord] || 'sea') }));
      }
    }
    svg.appendChild(layer);
    svg.appendChild(el('g', { id: 'hexlabels' }));
    svg.appendChild(el('g', { id: 'hexdeco' }));
    svg.appendChild(el('g', { id: 'distance' }));
    svg.appendChild(el('g', { id: 'marks' }));
    svg.appendChild(el('g', { id: 'distance-labels', 'pointer-events': 'none' }));
    // 天气图案压在最上层：只盖云/雨/闪电图案，不给格子刷底色，也不吃点击。
    svg.appendChild(el('g', { id: 'weather', 'pointer-events': 'none' }));
    // 每格的编号（hex id）是静态的：建图时画一次，之后不随推送重建。
    var labels = document.getElementById('hexlabels');
    for (var labelRow = 1; labelRow <= map.rows; labelRow++) {
      for (var labelCol = 1; labelCol <= map.cols; labelCol++) {
        var labelCoord = pad(labelRow) + pad(labelCol);
        var labelPoint = center(labelCoord);
        labels.appendChild(text(labelPoint.x, labelPoint.y - 9, labelCoord, '#5f7e86', 6.5, 400, 'middle'));
      }
    }
    built = true;
    hexDecoSig = '';
  }

  function clampView() {
    if (!FULL_VIEW || !VIEW) return;
    if (VIEW.w >= FULL_VIEW.w) VIEW.x = FULL_VIEW.x + (FULL_VIEW.w - VIEW.w) / 2;
    else VIEW.x = Math.min(FULL_VIEW.x + FULL_VIEW.w - VIEW.w, Math.max(FULL_VIEW.x, VIEW.x));
    if (VIEW.h >= FULL_VIEW.h) VIEW.y = FULL_VIEW.y + (FULL_VIEW.h - VIEW.h) / 2;

  function applyZoom(index) {
    if (!FULL_VIEW || !VIEW) return;
    zoomIndex = Math.max(0, Math.min(ZOOM_STEPS.length - 1, index));
    var level = ZOOM_STEPS[zoomIndex];
    var nextW = FULL_VIEW.w / level;
    var nextH = FULL_VIEW.h / level;
    var cx = VIEW.x + VIEW.w / 2;
    var cy = VIEW.y + VIEW.h / 2;
    VIEW = { x: cx - nextW / 2, y: cy - nextH / 2, w: nextW, h: nextH };
    clampView();
    applyView();
    updateZoomLabel();
  }

  function bindZoom() {
    var svg = document.getElementById('map');
    if (!svg || svg.dataset.zoomBound) return;
    svg.dataset.zoomBound = '1';
    var drag = null;
    svg.addEventListener('pointerdown', function (event) {
      if (event.button !== 0 || !VIEW) return;
      var target = event.target;
      if (target && target.closest && target.closest('[data-detail]')) return;
      closeDetail();
      var ctm = svg.getScreenCTM();
      if (!ctm || !ctm.a || !ctm.d) return;
      drag = {
        pointerId: event.pointerId,
        x: event.clientX,
        y: event.clientY,
        vx: VIEW.x,
        vy: VIEW.y,
        scaleX: ctm.a,
        scaleY: ctm.d,
        moved: false
      };
      svg.classList.add('dragging');
      // 指针捕获要等到真正拖动再拿：在 pointerdown 就 capture 会把后续 click 重定向到
      // SVG 根节点，算子和机场上的 click 全部收不到（点舰队/基地没反应就是这么来的）。
    });
    svg.addEventListener('pointermove', function (event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      var dx = event.clientX - drag.x;
      var dy = event.clientY - drag.y;
      if (!drag.moved && Math.sqrt(dx * dx + dy * dy) < 4) return;
      if (!drag.moved) {
        event.preventDefault();
        if (svg.setPointerCapture) svg.setPointerCapture(event.pointerId);
      }
      drag.moved = true;
      VIEW.x = drag.vx - dx / drag.scaleX;
      VIEW.y = drag.vy - dy / drag.scaleY;
      clampView();
      applyView();
    });
    function endDrag(event) {
      if (!drag || (event && event.pointerId !== drag.pointerId)) return;
      drag = null;
      svg.classList.remove('dragging');
    }
    svg.addEventListener('pointerup', endDrag);
    svg.addEventListener('pointercancel', endDrag);
    var zoomIn = document.getElementById('zoom-in');
    var zoomOut = document.getElementById('zoom-out');
    var reset = document.getElementById('zoom-value');
    if (zoomIn) zoomIn.addEventListener('click', function () { stepZoom(1); });
    if (zoomOut) zoomOut.addEventListener('click', function () { stepZoom(-1); });
    if (reset) reset.addEventListener('click', resetView);
    var detailClose = document.getElementById('detail-close');
    if (detailClose) detailClose.addEventListener('click', closeDetail);
    window.addEventListener('keydown', function (event) { if (event.key === 'Escape') { closeDetail(); clearDistance(); } });
  }

      marks.appendChild(layer);
    });
    // 当前距离带单独盖在最上层：这是“侦察机扫到哪条线”的唯一视觉标记。
    currentLayers.forEach(function (sector) {
      var layer = el('g', { class: 'recon-sector current-band' });
      sector.cells.forEach(function (coord) {
        var point = center(coord);
        layer.appendChild(el('polygon', {
          points: hexPoints(point.x, point.y),
          class: 'recon-cell current',
          fill: sector.color,
          'fill-opacity': 0.1,
          stroke: sector.color,
          'stroke-opacity': 0.55,
          'stroke-width': 1.1
        }));
      });
      var title = el('title');
      title.textContent = '侦察扇面 · ' + (sector.origin || '?') + ' → ' + (sector.heading || '?') + ' · 当前 ' + (sector.current || '?') + ' · 半径 ' + (sector.radius || '?');
      layer.appendChild(title);
      marks.appendChild(layer);
    });
  }

  function drawMarks(data) {
    var marks = document.getElementById('marks');
    if (!marks) return;
    marks.innerHTML = '';
    LAST_DATA = data;
    drawDistanceRings();
    drawReconSectors(data, marks);
    var byCoord = {};
    (data.fleets || []).forEach(function (fleet) {
      if (!fleet.coord) return;
      (byCoord[fleet.coord] = byCoord[fleet.coord] || []).push(fleet);
    });
    var airfieldCoords = {};
    ((data.ground_air && data.ground_air.length) ? data.ground_air : (data.airfields || [])).forEach(function (airfield) {
      airfieldCoords[airfield.coord] = true;
    });
    var placedLabels = [];
    // 牌子统一挂在舰影右侧，可它比 hex 宽得多，挨得近的两支舰队牌子会落到隔壁 hex 上，
    // 光看位置分不清哪块牌子说的是哪条船。所以从舰影拉一条红线到牌子最近的边，把归属钉死。
    // 线先建、后画舰队和牌子，于是它压在它们下面，不会盖住船影和字。
    var tethers = el('g', { id: 'fleet-tethers' });
    marks.appendChild(tethers);
    function labelOverlaps(rect) {
      return placedLabels.some(function (other) {
        return !(rect.x + rect.w < other.x || other.x + other.w < rect.x || rect.y + rect.h < other.y || other.y + other.h < rect.y);
      });
    }

    Object.keys(byCoord).forEach(function (coord) {
      var point = center(coord);
      var fleets = byCoord[coord];
      fleets.forEach(function (fleet, index) {
        var color = COLOR[fleet.faction] || '#9fb2b2';
        var offset = (index - (fleets.length - 1) / 2) * 9 + (airfieldCoords[coord] ? 10 : 0);

        // hex 里放舰影；牌子统一挂在这条船右侧（见下面 chosen 的算法）。
        var ship = el('g', { class: 'fleet-ship', 'data-detail': 'fleet', transform: 'translate(' + point.x + ',' + (point.y + offset) + ')' });
        ship.appendChild(shipIcon(fleet, color));
        var shipTitle = el('title');
        shipTitle.textContent = (fleet.fleet_name || fleet.name || fleet.fleet_id) + ' · ' + fleet.count + ' 艘 · ' + coord;
        ship.appendChild(shipTitle);
        ship.addEventListener('click', function (event) { event.stopPropagation(); selectDistance(fleet.coord); showFleetDetail(fleet); });
        marks.appendChild(ship);

        // 牌子统一挂在舰队右侧（不再左右上下乱试）：这样"牌子和船"的方向固定，
        // 再配上红线，一眼就能对上号。右边顶到地图边缘时往里收，不越界。
        var label = fleet.fleet_id || '';
        var wide = Math.max(62, label.length * 7 + 48);
        var chosen = {
          x: Math.min(point.x + SIZE + 7, MAP_WIDTH - wide - 4),
          y: point.y - 12 + index * 28
        };
        if (chosen.x < 4) chosen.x = 4;
        chosen.y = Math.min(chosen.y, MAP_HEIGHT - 28);
        // 右边是固定列，挨着/上下相邻的舰队牌子会撞：撞了就往下一格一格挪，挪到底再从顶部接着排。
        for (var guard = 0; guard < 80; guard++) {
          if (!labelOverlaps({ x: chosen.x, y: chosen.y, w: wide, h: 24 })) break;
          chosen.y += 26;
          if (chosen.y + 24 > MAP_HEIGHT) chosen.y = 4;
        }
        placedLabels.push({ x: chosen.x, y: chosen.y, w: wide, h: 24 });

        // 红线从舰影中心指到牌子最近的边：牌子在右就从左沿接，被挤到上/下就从对应边接。
        // 起点离舰影中心留 10，免得线穿过船体；贴太近（牌子压在自己 hex 上）就不画了。
        var shipX = point.x;
        var shipY = point.y + offset;
        var edgeX = Math.min(Math.max(shipX, chosen.x), chosen.x + wide);
        var edgeY = Math.min(Math.max(shipY, chosen.y), chosen.y + 24);
        var gapX = edgeX - shipX;
        var gapY = edgeY - shipY;
        var gap = Math.sqrt(gapX * gapX + gapY * gapY);
        if (gap > 8) {
          tethers.appendChild(el('line', {
            class: 'fleet-tether',
            x1: shipX + gapX / gap * 10,
            y1: shipY + gapY / gap * 10,
            x2: edgeX,
            y2: edgeY
          }));
        }

        var labelGroup = el('g', { class: 'fleet-label', 'data-detail': 'fleet', transform: 'translate(' + chosen.x + ',' + chosen.y + ')' });
        labelGroup.addEventListener('click', function (event) { event.stopPropagation(); selectDistance(fleet.coord); showFleetDetail(fleet); });
        labelGroup.appendChild(el('rect', { x: 0, y: 0, width: wide, height: 24, rx: 3, fill: color, 'fill-opacity': 0.18, stroke: color, 'stroke-width': 1 }));
        labelGroup.appendChild(text(5, 10, label, color, 10, 700));
        labelGroup.appendChild(text(wide - 6, 10, '×' + fleet.count, '#e8cd8b', 10, 700, 'end'));
        labelGroup.appendChild(text(5, 21, coord, '#9fc4cb', 8, 600));
        var title = el('title');
        title.textContent = (fleet.fleet_name || fleet.name || label) + ' · ' + fleet.count + ' 艘 · 强度 ' + fleet.strength + '/' + fleet.max_strength + (fleet.coord ? ' · ' + fleet.coord : '');
        labelGroup.appendChild(title);
        marks.appendChild(labelGroup);
      });
    });
    ((data.ground_air && data.ground_air.length) ? data.ground_air : (data.airfields || [])).forEach(function (airfield) {
      var point = center(airfield.coord);
      var group = el('g', { transform: 'translate(' + point.x + ',' + point.y + ')' });
      group.appendChild(el('rect', { x: -8, y: -8, width: 16, height: 16, rx: 2, fill: '#1c2f34', stroke: COLOR[airfield.faction] || '#829a9c', 'stroke-width': 1 }));
      group.appendChild(text(0, 3, '机', '#cfe0dc', 8, 600, 'middle'));
      var based = (airfield.aircraft || []).filter(function (aircraft) {
        return !AIRBORNE[aircraft.status];
      }).length;
      if (based > 0) {
        group.appendChild(text(9, -4, '×' + based, COLOR[airfield.faction] || '#cfe0dc', 8, 700, 'start'));
      }
      // 敌方卸在这个机场上的滩头物资：有货就说明机场正在被占领，用红字标在图标左侧。
      if (airfield.enemy_supplies) {
        group.appendChild(text(-10, 3, String(airfield.enemy_supplies), '#ff6b5e', 9, 700, 'end'));
      }
      var title = el('title');
      title.textContent = airfield.name + ' · ' + airfield.coord + ' · 驻机 ' + based;
      group.appendChild(title);
      group.setAttribute('class', 'map-airfield');
      group.setAttribute('data-airfield-id', airfield.unit_id || airfield.id || '');
      group.setAttribute('data-detail', 'airfield');
      group.style.cursor = 'pointer';
      group.addEventListener('click', function (event) { event.stopPropagation(); selectDistance(airfield.coord); showAirfieldDetail(airfield); });
      marks.appendChild(group);
    });
    // 空中单位：按实际坐标画小飞机，A 蓝 B 红；同格多架合并成 ×N。
    var seenAircraft = {};
    var airGroups = {};
    // 任务级的起飞顶点/目标按 task_id 建索引：前出的 CAP、按坐标聚合过的混编编队，
    // 逐机上只有当前坐标，起飞点和值班空域只记在任务里。
    var taskInfo = {};
    ((data.aviation && data.aviation.tasks) || []).forEach(function (task) {
      if (task.id) taskInfo[task.id] = { origin: task.origin_coord || '', target: task.target_coord || '' };
    });
    ((data.ground_tasks) || []).forEach(function (task) {
      if (task.id) taskInfo[task.id] = { origin: task.origin_coord || '', target: task.target_coord || '' };
    });
    function addAircraft(aircraft, fallbackFaction, task) {
      if (!aircraft || !aircraft.id || seenAircraft[aircraft.id]) return;
      seenAircraft[aircraft.id] = true;
      if (!aircraft.coord || !AIRBORNE[aircraft.status]) return;
      // 侦察机交给扇面图层表达，不再画机体；否则“飞机到了哪”会和“搜索带扫到哪”打架。
      var status = String(aircraft.status || '').toLowerCase();
      if (status === 'recon') return;
      var faction = aircraft.faction || fallbackFaction || 'A';
      var mission = missionLabel(aircraft.task_kind || status);
      var key = aircraft.coord + '|' + faction + '|' + mission;
      if (!airGroups[key]) {
        airGroups[key] = {
          coord: aircraft.coord,
          faction: faction,
          mission: mission,
          count: 0,
          aircraft: [],
          // 起飞顶点和任务目标：详情卡上要写清"这队飞机从哪儿起飞、要去哪儿"。
          origin: '',
          target: '',
          // 返航中的架数：整队都在往回飞时，标题和地图牌上都标出来。
          returning: 0,
          heading: String(aircraft.heading || aircraft.search_heading || '').toUpperCase()
        };
      }
      airGroups[key].count++;
      if (aircraft.returning) airGroups[key].returning++;
      // 逐机的坐标可能缺（老快照、或者 CAP 的值班空域只记在任务上），任务上的值兜底。
      var info = taskInfo[aircraft.task_id] || {};
      var origin = aircraft.origin_coord || info.origin || (task && task.origin_coord) || '';
      var target = aircraft.target_coord || info.target || (task && task.target_coord) || '';
      if (!airGroups[key].origin && origin) airGroups[key].origin = origin;
      if (!airGroups[key].target && target) airGroups[key].target = target;
      airGroups[key].aircraft.push(aircraft);
    }
    ((data.aviation && data.aviation.carriers) || []).forEach(function (carrier) {
      (carrier.aircraft || []).forEach(function (aircraft) { addAircraft(aircraft, carrier.faction); });
    });
    (data.ground_air || []).forEach(function (airfield) {
      (airfield.aircraft || []).forEach(function (aircraft) { addAircraft(aircraft, airfield.faction); });
    });
    ((data.aviation && data.aviation.tasks) || []).forEach(function (task) {
      (task.aircraft || []).forEach(function (aircraft) { addAircraft(aircraft, task.faction, task); });
    });

    var airByCoord = {};
    Object.keys(airGroups).forEach(function (key) {
      var group = airGroups[key];
      (airByCoord[group.coord] = airByCoord[group.coord] || []).push(group);
    });
    Object.keys(airByCoord).forEach(function (coord) {
      var point = center(coord);
      var groups = airByCoord[coord];
      groups.forEach(function (group, index) {
        var color = COLOR[group.faction] || '#d7bb7b';
        var offsetY = (index - (groups.length - 1) / 2) * 16;
        var marker = el('g', { class: 'watch-air', 'data-detail': 'air', transform: 'translate(' + point.x + ',' + (point.y - 20 + offsetY) + ')' });
        marker.addEventListener('click', function (event) { event.stopPropagation(); selectDistance(group.coord); showAirDetail(group); });
        marker.appendChild(el('circle', { r: 8, fill: color, 'fill-opacity': 0.92, stroke: '#071417', 'stroke-width': 1 }));
        marker.appendChild(text(0, 3, group.count, '#071417', 9, 700, 'middle'));
        var labelRight = point.x < MAP_WIDTH - 78;
        // 整队都在往回飞时牌子上标个"返"，不用点开详情也知道这波已经撤了。
        var missionText = group.mission + (group.count > 0 && group.returning >= group.count ? ' · 返' : '');
        var label = text(labelRight ? 11 : -11, 3, missionText, color, 9, 700, labelRight ? 'start' : 'end');
        label.setAttribute('stroke', '#071417');
        label.setAttribute('stroke-width', '2.6');
        label.setAttribute('stroke-linejoin', 'round');
        label.setAttribute('paint-order', 'stroke');
        marker.appendChild(label);
        var title = el('title');
        title.textContent = (group.faction === 'A' ? '美军' : '日军') + ' ' + group.mission + ' ' + group.count + ' 架 · ' + coord;
        marker.appendChild(title);
        marks.appendChild(marker);
      });
    });

    // 老快照没有逐机坐标时，退回任务标记；侦察同样只靠扇面。
    ((data.aviation && data.aviation.tasks) || []).forEach(function (task) {
      if (task.kind === 'recon') return;
      if ((task.aircraft && task.aircraft.length) || !task.airborne_count || !task.current_coord) return;
      var point = center(task.current_coord);
      var color = COLOR[task.faction] || '#d7bb7b';
      var group = el('g', { class: 'watch-air', 'data-detail': 'air', transform: 'translate(' + point.x + ',' + (point.y - 26) + ')' });
      group.addEventListener('click', function (event) { event.stopPropagation(); selectDistance(task.current_coord); showAirDetail({ faction: task.faction, coord: task.current_coord, mission: missionLabel(task.kind), origin: task.origin_coord || '', target: task.target_coord || '', count: task.airborne_count, aircraft: task.aircraft || [] }); });
      group.appendChild(el('circle', { r: 7, fill: color, 'fill-opacity': 0.92, stroke: '#071417', 'stroke-width': 1 }));
      group.appendChild(text(0, 3, task.airborne_count > 1 ? '×' + task.airborne_count : '1', '#071417', 8, 700, 'middle'));
      var label = text(11, 3, missionLabel(task.kind), color, 9, 700);
      label.setAttribute('stroke', '#071417');
      label.setAttribute('stroke-width', '2.6');
      label.setAttribute('paint-order', 'stroke');
      group.appendChild(label);
      var title = el('title');
      title.textContent = task.name + ' · ' + task.phase + (task.target_coord ? ' · 目标 ' + task.target_coord : '');
      group.appendChild(title);
      marks.appendChild(group);
    });
  }

  function row(label, value, note) {
    return '<div class="row"><span>' + label + '</span><span>' + value + (note ? ' <small>' + note + '</small>' : '') + '</span></div>';
  }
  function escapeHTML(value) {
    return String(value == null ? '' : value).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  function renderSummary(data) {
    var clock = data.clock || {};
    var phase = clock.night ? '夜战' : (clock.service_open ? '整备中' : '待命');
    if (clock.launch_open) phase = '可放飞';
    var target = document.getElementById('summary');
    var html = '';
    if (data.scenario && data.scenario.description) {
      html += '<details class="briefing"><summary>战役简报 · ' + escapeHTML(data.scenario.name || '') + '</summary><div>' + escapeHTML(data.scenario.description) + '</div></details>';
    }
    html += row('剧本时间', (clock.day ? '第' + clock.day + '天 ' : '') + (clock.time || '–'), clock.turn_minutes ? clock.turn_minutes + ' 分钟/回合' : '');
    html += row('阶段', phase, clock.recover_by ? clock.recover_by + ' 前回收' : '');
    var wind = data.wind;
    if (wind && typeof wind === 'object') wind = wind.wind || wind.name || '';
    html += row('风力', escapeHTML(wind || '–'));
    html += row('舰船', (data.units || []).length + ' 艘', (data.fleets || []).length + ' 支舰队');
    var scores = data.scores || {};
    var points = function (value) { return Math.round((Number(value) || 0) * 100) / 100; };
    html += '<div class="row"><span>战果分</span><span><span class="tag a">A</span> ' + points(scores.A) + ' : ' + points(scores.B) + ' <span class="tag b">B</span></span></div>';
    var losses = data.losses || {};
    ['A', 'B'].forEach(function (side) {
      var ledger = losses[side] || {};
      html += '<div class="row"><span><span class="tag ' + side.toLowerCase() + '">' + side + '</span> 损失</span><span>' + (ledger.ship_total || 0) + ' 舰 · ' + (ledger.aircraft_total || 0) + ' 机</span></div>';
    });
    (data.objectives || []).forEach(function (objective) {
      if (objective.kind === 'score') {
        html += row('计分', 'VP 比值决定胜负', '<1.25 平局 · 1.25–2 战术 · >2 战略');
        return;
      }
      var side = objective.faction || '';
      var enemy = side === 'A' ? 'B' : 'A';
      if (objective.kind === 'supplies') {
        var supplies = data.shore_supplies || {};
        var delivered = supplies[side + '|' + objective.coord] || 0;
        html += '<div class="row"><span><span class="tag ' + side.toLowerCase() + '">' + escapeHTML(side) + '</span> ' + escapeHTML(objective.text || '投送物资') + '</span><span>' + delivered + ' / ' + (objective.value || 0) + (objective.decisive ? ' · 决定' : '') + '</span></div>';
        return;
      }
      var enemyLedger = (data.losses || {})[enemy] || {};
      var killed = enemyLedger.ship_total || 0;
      html += '<div class="row"><span><span class="tag ' + side.toLowerCase() + '">' + escapeHTML(side) + '</span> 击沉 ' + (objective.value || 0) + ' 艘</span><span>' + killed + ' / ' + (objective.value || 0) + '</span></div>';
    });
    if (data.outcome) {
      var level = data.outcome.level === 'draw' ? '平分秋色' : data.outcome.level === 'tactical' ? '战术胜利' : data.outcome.level === 'strategic' ? '战略胜利' : '';
      var winner = data.outcome.winner === 'A' ? '美军' : data.outcome.winner === 'B' ? '日军' : '';
      var result = level ? (winner ? winner + ' · ' + level : level) : (winner ? winner + '获胜' : '已结束');
      html += row('结局', escapeHTML(result));
      if (data.outcome.reason) html += '<div class="outcome-reason">' + escapeHTML(data.outcome.reason) + '</div>';
    }
    target.innerHTML = html;
  }

  function renderFleets(data) {
    var target = document.getElementById('fleets');
    var fleets = (data.fleets || []).slice().sort(function (a, b) {
      if (a.faction !== b.faction) return String(a.faction).localeCompare(String(b.faction));
      return String(a.fleet_id).localeCompare(String(b.fleet_id));
    });
    if (!fleets.length) { target.innerHTML = '<div class="empty">暂无舰队</div>'; return; }
    target.innerHTML = fleets.map(function (fleet) {
      var side = String(fleet.faction || '?').toLowerCase();
      return '<div class="fleet-line"><span class="tag ' + side + '">' + escapeHTML(fleet.faction) + '</span>' +
        '<span>' + escapeHTML(fleet.fleet_name || fleet.name) + '</span>' +
        '<span class="coord">' + escapeHTML(fleet.coord) + '</span>' +
        '<span class="meta">' + fleet.count + ' 艘 · ' + fleet.strength + '/' + fleet.max_strength + (fleet.move_cooldown ? ' · 冷却' + fleet.move_cooldown : '') + '</span></div>';
    }).join('');
  }

  function renderCarriers(data) {
    var target = document.getElementById('carriers');
    var carriers = (data.aviation && data.aviation.carriers) ? data.aviation.carriers : [];
    if (!carriers.length) { target.innerHTML = '<div class="empty">暂无航母</div>'; return; }
    target.innerHTML = carriers.map(function (carrier) {
      var airborne = (carrier.aircraft || []).filter(function (aircraft) {
        return aircraft.status === 'cap' || aircraft.status === 'recon' || aircraft.status === 'attack' || aircraft.status === 'attack_holding';
      }).length;
      var side = String(carrier.faction || '').toLowerCase();
      return '<div class="fleet-line"><span>' + (side ? '<span class="tag ' + side + '">' + escapeHTML(carrier.faction) + '</span> ' : '') + escapeHTML(carrier.name) + '</span>' +
        '<span class="meta">机库 ' + carrier.hangar_used + '/' + carrier.hangar_capacity + ' · 甲板 ' + carrier.deck_used + '/' + carrier.deck_capacity + ' · 空中 ' + airborne + (carrier.blocked_reason ? ' · ' + escapeHTML(carrier.blocked_reason) : '') + '</span></div>';
    }).join('');
  }

  function renderEvents(data) {
    var target = document.getElementById('events');
    // 事件按时间正序返回（补丁只能往数组尾部追加，快照必须同序）；
    // 页面上要"最新的在最上面"，所以取尾部 60 条再翻过来。
    var events = (data.events || []).slice(-60).reverse();
    if (!events.length) { target.innerHTML = '<li class="empty">暂无战报</li>'; return; }
    target.innerHTML = events.map(function (event) {
      var stamp = event.created_at ? new Date(event.created_at) : null;
      var time = stamp && !isNaN(stamp) ? pad(stamp.getHours()) + ':' + pad(stamp.getMinutes()) : '';
      return '<li><time>T' + event.turn + (time ? ' ' + time : '') + '</time><span>' + escapeHTML(event.text) + '</span></li>';
    }).join('');
  }

  function render(data) {
    if (!built) buildMap(data.map);
    bindZoom();
    drawMarks(data);
    document.getElementById('scenario').textContent = (data.scenario && data.scenario.name) || '珊瑚海';
    document.getElementById('turn').textContent = data.turn;
    document.getElementById('clock').textContent = data.clock ? data.clock.time : '–';
    var status = document.getElementById('status');
    status.textContent = data.status === 'running' ? '进行中' : String(data.status || '');
    status.className = 'status ' + (data.status === 'running' ? 'running' : 'finished');
    renderSummary(data);
    renderHexDeco(data);
    renderFleets(data);
    renderCarriers(data);
    renderEvents(data);
    document.getElementById('room').textContent = '房间 ' + data.room_id;
    document.getElementById('updated').textContent = '最后刷新 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
  }

  function fail(message) {
    document.getElementById('status').textContent = '连接失败';
    document.getElementById('status').className = 'status finished';
    document.getElementById('summary').innerHTML = '<div class="err">' + escapeHTML(message) + '</div>';
  }

  // 服务端连上给全量、之后只给和上一帧的差异，这里合并回完整视图再渲染。
  // 合并语义和 web/src/patch.ts、internal/server/patch.go 一致（按实体 id 对齐）。
  var pushedView = null;
  var ENTITY_KEYS = ['id', 'unit_id', 'task_id', 'carrier_id', 'fleet_id', 'coord'];
  function entityKey(item) {
    if (!item || typeof item !== 'object') return '';
    for (var i = 0; i < ENTITY_KEYS.length; i++) {
      var value = item[ENTITY_KEYS[i]];
      // 事件的 id 是数字，和 Go 侧 keyText 一样统一转成字符串再比。
      if (typeof value === 'string' && value) return value;
      if (typeof value === 'number' && isFinite(value)) return String(value);
    }
    return '';
  }
  // 字符串键 map 删键时服务端给 {"set":{变化的键},"remove":[消失的键]}：
  // JSON 对象本身没法表达"键没了"，和实体数组的 upsert/remove 是同一套语义。
  function isMapPatch(patch) {
    if (!patch || typeof patch !== 'object' || Array.isArray(patch)) return false;
    var hasSet = patch.set && typeof patch.set === 'object' && !Array.isArray(patch.set);
    return Boolean(hasSet) || Array.isArray(patch.remove);
  }
  function mergeValue(base, patch) {
    if (isMapPatch(patch) && base && typeof base === 'object' && !Array.isArray(base)) {
      var mapOut = {};
      for (var mapKey in base) if (Object.prototype.hasOwnProperty.call(base, mapKey)) mapOut[mapKey] = base[mapKey];
      if (patch.set) mapOut = mergeValue(mapOut, patch.set);
      (patch.remove || []).forEach(function (key) { delete mapOut[key]; });
      return mapOut;
    }
    if (Array.isArray(base) && patch && typeof patch === 'object' && !Array.isArray(patch) && ('upsert' in patch || 'remove' in patch)) {
      var merged = base.slice();
      var position = {};
      merged.forEach(function (item, index) { position[entityKey(item)] = index; });
      (patch.upsert || []).forEach(function (item) {
        var key = entityKey(item);
        if (Object.prototype.hasOwnProperty.call(position, key)) merged[position[key]] = mergeValue(merged[position[key]], item);
        else { position[key] = merged.length; merged.push(item); }
      });
      if (patch.remove && patch.remove.length) {
        var dropped = {};
        patch.remove.forEach(function (key) { dropped[key] = true; });
        merged = merged.filter(function (item) { return !dropped[entityKey(item)]; });
      }
      return merged;
    }
    if (patch && typeof patch === 'object' && !Array.isArray(patch) && base && typeof base === 'object' && !Array.isArray(base)) {
      var out = {};
      for (var key in base) if (Object.prototype.hasOwnProperty.call(base, key)) out[key] = base[key];
      for (var name in patch) if (Object.prototype.hasOwnProperty.call(patch, name)) out[name] = mergeValue(base[name], patch[name]);
      return out;
    }
    return patch;
  }
  var reconnectDelay = 1000;
  var reconnectTimer = null;
  var terminalError = false;
  function connect() {
    if (!room || !token) { fail('观战地址缺少房间 token，例如 /watch/XXXX-XXXX-XXXX'); return; }
    var scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var socket = new WebSocket(scheme + '//' + location.host + '/ws?mode=spectator');
    socket.onopen = function () {
      reconnectDelay = 1000;
      document.getElementById('status').textContent = '已连接';
      socket.send(JSON.stringify({ type: 'subscribe', room_id: room, token: token }));
    };
    socket.onmessage = function (event) {
      try {
        var message = JSON.parse(event.data);
        if (message.type === 'snapshot' && message.view) { pushedView = message.view; render(pushedView); return; }
        if (message.type === 'snapshot' && message.patch) {
          if (!pushedView) return; // 底座还没到，等重连时的全量
          pushedView = mergeValue(pushedView, message.patch);
          render(pushedView);
          return;
        }
        if (message.type === 'error') { terminalError = true; fail(message.error || '读取失败'); }
      } catch (error) { fail('读取失败：' + error.message); }
    };
    socket.onerror = function () { socket.close(); };
    socket.onclose = function () {
      if (terminalError) return;
      document.getElementById('status').textContent = '连接中断，正在重连…';
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 10000);
    };
  }

  connect();
})();
</script>
</body>

openapi: 3.0.3
info:
  title: General Quarters HTTP API
  version: 0.3.0
  description: |-
    大厅、健康检查和观战 token 解析接口。
    创建房间只生成空房间；A/B 玩家都凭 token 和指定阵营加入，分别取得独立会话。
    房间内的 state、events、commands、ready 与观战统一使用 WebSocket，不再提供 HTTP 接口。
    WebSocket RPC、快照和增量补丁契约见仓库根目录 API.md；OpenAPI 3.0 不描述这些帧协议。
servers:
  - url: /
tags:
  - name: System
  - name: Rooms
  - name: Spectator
paths:
  /healthz:
    get:
      tags: [System]
      summary: 健康检查
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, example: ok}
  /api/docs:
    get:
      tags: [System]
      summary: 在线 API 速查页
      responses:
        '200':
          description: HTML 文档
          content:
            text/html:
              schema: {type: string}
  /api/v1/openapi.yaml:
    get:
      tags: [System]
      summary: 下载 HTTP OpenAPI 定义
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema: {type: string}
  /api/v1/rooms:
    post:
      tags: [Rooms]
      summary: 创建不含玩家的空房间
      description: 不选择阵营、不创建房主，也不设置会话 Cookie。调用者使用返回的 token 分别为 A/B 调用加入接口。
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRoomRequest'}
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateRoomResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/v1/rooms/join:
    post:
      tags: [Rooms]
      summary: 使用邀请 token 和指定阵营加入房间
      description: A/B 使用同一接口，各最多一名玩家，允许 B 先加入。成功后设置独立的 gq_session Cookie；响应不返回 join_token。进入房间后使用该 Cookie 连接 /ws，断线也用原会话重连。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JoinRoomRequest'}
      responses:
        '200':
          description: 加入成功
          headers:
            Set-Cookie:
              description: 玩家会话 Cookie
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JoinRoomResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/v1/watch/{token}:
    get:
      tags: [Spectator]
      summary: 将观战 token 解析为房间 ID
      description: 取得 room_id 后连接 /ws?mode=spectator，并用 room_id 和同一 token 订阅。观战快照与补丁不经过 HTTP。
      parameters:
        - name: token
          in: path
          required: true
          description: 12 位邀请 token，可带显示用连字符
          schema: {type: string, example: 7K4M-9Q2X-6T8P}
      responses:
        '200':
          description: 解析成功
          content:
            application/json:
              schema:
                type: object
                required: [room_id]
                properties:
                  room_id: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  responses:
    BadRequest:
      description: 请求、未知字段、token、阵营或业务条件无效
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: 房间、接口或 token 不存在
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: 阵营席位已占用或房间席位已满
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalServerError:
      description: 状态或数据库内部错误
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string, example: 请求JSON无效}
        error_code: {type: string}
        error_params:
          type: object
          additionalProperties: {type: string}
    CreateRoomRequest:
      type: object
      additionalProperties: false
      properties:
        scenario_id: {type: string, enum: [_coral_real, _marianas], default: _coral_real}
        solo: {type: boolean, default: false, description: true 创建只允许一个玩家席位的单人沙盒，false 创建双人房}
    JoinRoomRequest:
      type: object
      additionalProperties: false
      required: [token, faction]
      properties:
        token: {type: string, example: 7K4M-9Q2X-6T8P}
        faction: {type: string, enum: [A, B]}
        name: {type: string, example: 玩家B}
    CreateRoomResponse:
      type: object
      required: [room_id, join_token]
      properties:
        room_id: {type: string}
        join_token: {type: string}
    JoinRoomResponse:
      type: object
      required: [room_id, player_id, faction]
      properties:
        room_id: {type: string}
        player_id: {type: string}
        faction: {type: string, enum: [A, B]}

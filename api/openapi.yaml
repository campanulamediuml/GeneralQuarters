openapi: 3.0.3
info:
  title: General Quarters API
  version: 0.1.0
  description: 权威服务器房间与回合接口。所有命中、移动合法性和战争迷雾均由服务器处理。
servers:
  - url: /
tags:
  - name: System
  - name: Rooms
  - name: Commands
paths:
  /healthz:
    get:
      tags: [System]
      summary: 健康检查
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
  /api/v1/openapi.yaml:
    get:
      tags: [System]
      summary: 下载OpenAPI文档
      responses:
        '200': {description: OpenAPI YAML}
  /api/v1/rooms:
    post:
      tags: [Rooms]
      summary: 创建房间并载入剧本
      description: 创建后自动成为A阵营房主，并通过HttpOnly Cookie建立玩家会话。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, example: 玩家A}
                scenario_id: {type: string, example: _sandbox, default: _sandbox}
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoomResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/rooms/join:
    post:
      tags: [Rooms]
      summary: 使用邀请token加入房间
      description: 成功后成为剩余阵营玩家，并建立独立HttpOnly会话。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, example: 7K4M-9Q2X-6T8P}
                name: {type: string, example: 玩家B}
      responses:
        '200':
          description: 加入成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoomResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/rooms/{roomID}/state:
    get:
      tags: [Rooms]
      summary: 获取当前玩家的私有游戏快照
      description: 响应只包含该玩家有权看到的单位、命令和事件。join_token仅向房主返回。
      parameters:
        - {$ref: '#/components/parameters/RoomID'}
      responses:
        '200':
          description: 私有快照
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GameView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/rooms/{roomID}/events:
    get:
      tags: [Rooms]
      summary: 获取当前玩家可见的最近100条事件
      parameters:
        - {$ref: '#/components/parameters/RoomID'}
      responses:
        '200':
          description: 事件列表，按事件ID倒序
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/Event'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/rooms/{roomID}/commands:
    post:
      tags: [Commands]
      summary: 提交立即生效的移动、整编或航空命令
      description: command_id用于幂等重试，base_version用于拒绝过期操作。移动、整编、CAP和扇面侦察立即结算；扇面hex、发现判定和情报只由服务端计算。CLEAR_MOVE仅清理旧版协议的待结算命令。
      parameters:
        - {$ref: '#/components/parameters/RoomID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Command'}
      responses:
        '200':
          description: 命令已接受，或返回幂等命令的首次响应
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: {type: boolean}
                  command_id: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/rooms/{roomID}/ready:
    post:
      tags: [Commands]
      summary: 设置回合准备状态
      description: 所有当前玩家ready后同步结算回合。单人沙盒中，唯一玩家ready即可结算。
      parameters:
        - {$ref: '#/components/parameters/RoomID'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_version, ready]
              properties:
                base_version: {type: integer, format: int64, example: 1}
                ready: {type: boolean, example: true}
      responses:
        '200':
          description: 最新私有快照
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GameView'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  parameters:
    RoomID:
      name: roomID
      in: path
      required: true
      schema: {type: string, example: 04ca6f34b85a65d2}
  responses:
    BadRequest:
      description: 请求或命令无效
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: 缺少或失效的玩家会话
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: 会话不属于该房间
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: base_version已过期或回合正在结算
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string, example: 目标必须与当前hex相邻且可通行}
    RoomResponse:
      type: object
      properties:
        room_id: {type: string}
        player_id: {type: string}
        join_token: {type: string, description: 仅创建房间时返回}
    Command:
      type: object
      required: [command_id, base_version, type]
      properties:
        command_id: {type: string, maxLength: 128}
        base_version: {type: integer, format: int64}
        type: {type: string, enum: [SET_MOVE, CLEAR_MOVE, MERGE_FLEET, REORGANIZE_HEX, LAUNCH_CAP, LAUNCH_RECON, PREPARE_AIR, RETURN_TO_HANGAR, RECOVER_AIR, PRIORITIZE_AIR_TASK]}
        unit_id: {type: string, description: 舰船移动与整编命令必填, example: a-bb-01}
        target_unit_id: {type: string, description: MERGE_FLEET必填，目标舰队中的单位, example: a-dd-01}
        aircraft_id: {type: string, description: 单算子航空命令或任务ID, example: air-b-01}
        aircraft_ids: {type: array, minItems: 1, maxItems: 20, items: {type: string}, description: 同一母舰的批量算子；起飞任务必须同型}
        coord: {type: string, description: SET_MOVE和REORGANIZE_HEX必填，ABCD坐标, example: '0203'}
        heading: {type: string, enum: [E, SE, SW, W, NW, NE], description: LAUNCH_RECON必填，搜索航线中轴；侦察机、TBF鱼雷机和SB2C俯冲轰炸机可执行, example: W}
        sector_width: {type: integer, enum: [60, 120], description: LAUNCH_RECON必填；120度最终发现率减半, example: 60}
        recon_radius: {type: integer, minimum: 0, description: 可选；省略或为0时使用recon_radius_limit，手动值不能超过该上限, example: 6}
        assignments:
          type: object
          description: REORGANIZE_HEX必填，该hex全部己方单位ID到fleet_id的映射
          additionalProperties: {type: string}
          example: {a-flag: a-flag, a-screen: a-flag}
    Player:
      type: object
      properties:
        id: {type: string}
        faction: {type: string, enum: [A, B]}
        name: {type: string}
        is_host: {type: boolean}
        ready: {type: boolean}
        connected: {type: boolean}
    ShipCard:
      type: object
      description: 服务端生成的舰船角色卡。当前生命在Unit.strength中，其余当前装备与能力在此字段中。
      properties:
        gunnery: {type: integer, description: 服务端按主炮口径×数量÷9四舍五入计算}
        damage_control: {type: integer, description: 当前损管值，DCT骰点小于等于此值时通过}
        main_gun_count: {type: integer}
        main_gun_caliber: {type: number, description: 主炮口径，英寸}
        heavy_aa: {type: number}
        light_aa: {type: number}
        surface_radar: {type: boolean}
        air_radar: {type: boolean}
        speed_class: {type: string, enum: [normal, fast, slow, very_slow]}
        torpedo_salvos: {type: integer, description: 剩余齐射轮数，每轮4枚鱼雷}
        aircraft: {type: integer, description: 当前舰载机或水上飞机数量}
        hangar_capacity: {type: integer, description: 独立机库容量；CV默认24，CVL/CVE默认9，非航母由具体剧本部署指定}
        deck_capacity: {type: integer, description: 航母每回合起降容量}
        elevator_count: {type: integer}
        depth_charges: {type: integer}
        cargo: {type: integer}
        armored_carrier: {type: boolean}
        historical_loss: {type: string, description: 历史沉没时间，可选}
    Unit:
      type: object
      properties:
        id: {type: string}
        definition_id: {type: string, description: 单位目录中的稳定定义ID}
        fleet_id: {type: string}
        name: {type: string}
        type: {type: string, enum: [BB, BC, CA, CL, DD, CV, CVL, TRS, CVE]}
        faction: {type: string}
        coord: {type: string, example: '0202'}
        heading: {type: string, enum: [E, SE, SW, W, NW, NE]}
        moved: {type: boolean, description: 本回合是否已经移动}
        strength: {type: integer, description: 当前生命值}
        max_strength: {type: integer, description: 初始生命值}
        card: {$ref: '#/components/schemas/ShipCard'}
        legal_moves:
          type: array
          description: 仅己方单位返回，由服务器计算
          items: {type: string}
    DistanceReference:
      type: object
      description: 服务端生成的选中算子距离参考
      properties:
        origin: {type: string, example: '0202'}
        max_distance: {type: integer, example: 8}
        cells:
          type: array
          items:
            type: object
            properties:
              coord: {type: string, example: '0208'}
              distance: {type: integer, example: 6}
    FleetGroup:
      allOf:
        - {$ref: '#/components/schemas/Unit'}
        - type: object
          description: 服务端生成的地图舰队投影；id为舰队首舰单位ID，客户端不得以此修改状态
          properties:
            fleet_id: {type: string}
            members:
              type: array
              items: {$ref: '#/components/schemas/Unit'}
            count: {type: integer, description: 成员舰船数量}
            strength: {type: integer, description: 服务端汇总的当前总强度}
            max_strength: {type: integer, description: 服务端汇总的最大总强度}
            moved: {type: boolean, description: 舰队本回合是否已经移动}
            distance_reference: {$ref: '#/components/schemas/DistanceReference'}
    AirUnit:
      type: object
      properties:
        id: {type: string}
        definition_id: {type: string}
        carrier_id: {type: string}
        faction: {type: string, enum: [A, B]}
        name: {type: string}
        model: {type: string}
        kind: {type: string, enum: [fighter, dive_bomber, torpedo_bomber, recon]}
        status: {type: string, enum: [hangar, service, deck, ready, cap, recon], description: hangar未整备，service机库整备完成，deck甲板准备完成，ready水机起飞准备完成}
        strength: {type: integer}
        max_range: {type: integer, description: 服务端包含副油箱后的最大航程}
        remaining_range: {type: integer}
        air_combat: {type: integer}
        anti_ship: {type: integer}
        anti_ground: {type: integer}
        seaplane: {type: boolean, description: true时界面使用橙色水机算子}
        launched: {type: boolean, description: 是否占用本回合起飞容量}
        priority: {type: integer}
        task_id: {type: string, description: 同一批量航空任务的共享ID，预备任务也会立即分配}
        task_kind: {type: string, enum: [cap, recon], description: 已分配任务类型，算子尚未起飞时用于区分预备任务}
        origin_coord: {type: string, description: 侦察扇面顶点}
        coord: {type: string, description: 侦察机当前hex}
        heading: {type: string, enum: [E, SE, SW, W, NW, NE]}
        sector_width: {type: integer, enum: [60, 120]}
        recon_radius: {type: integer}
        recon_distance: {type: integer, description: 当前距离圈}
        recon_radius_limit: {type: integer, description: 服务端按返航燃料给出的最大可选半径}
        returning: {type: boolean}
        tracking_fleet_id: {type: string}
    AirTask:
      type: object
      properties:
        id: {type: string}
        kind: {type: string, enum: [cap, recon, asw, attack]}
        phase: {type: string, enum: [servicing, preparing, launching, active], description: 服务端任务阶段，依次对应整备中、起飞准备中、起飞中、任务执行中}
        name: {type: string}
        carrier_id: {type: string}
        aircraft_ids: {type: array, items: {type: string}}
        aircraft: {type: array, items: {$ref: '#/components/schemas/AirUnit'}}
        priority: {type: integer, description: 1为最高优先级}
        origin_coord: {type: string}
        current_coord: {type: string}
        heading: {type: string, enum: [E, SE, SW, W, NW, NE]}
        sector_width: {type: integer, enum: [60, 120]}
        recon_radius: {type: integer}
        recon_distance: {type: integer}
        returning: {type: boolean}
        tracking_fleet_id: {type: string}
        sector_hexes: {type: array, items: {type: string}, description: 服务端计算的完整扇面覆盖}
        current_ring_hexes: {type: array, items: {type: string}, description: 服务端计算的当前距离圈覆盖}
        distance_reference: {$ref: '#/components/schemas/DistanceReference'}
    CarrierAirStatus:
      type: object
      properties:
        unit_id: {type: string}
        name: {type: string}
        type: {type: string}
        hangar_used: {type: integer}
        hangar_capacity: {type: integer}
        deck_capacity: {type: integer}
        deck_used: {type: integer, description: 当前停放在甲板的算子数}
        launch_used: {type: integer, description: 本回合已经起飞的算子数}
        operation: {type: string, enum: ['', prepare, launch, recover]}
        aircraft: {type: array, items: {$ref: '#/components/schemas/AirUnit'}}
    AviationView:
      type: object
      properties:
        carriers: {type: array, items: {$ref: '#/components/schemas/CarrierAirStatus'}}
        tasks: {type: array, items: {$ref: '#/components/schemas/AirTask'}}
    Event:
      type: object
      properties:
        id: {type: integer, format: int64}
        turn: {type: integer}
        sequence: {type: integer}
        type: {type: string}
        text: {type: string}
        created_at: {type: string, format: date-time}
    GameView:
      type: object
      properties:
        room_id: {type: string}
        status: {type: string}
        turn: {type: integer}
        version: {type: integer, format: int64}
        scenario:
          type: object
          properties:
            id: {type: string}
            name: {type: string}
            description: {type: string}
        map: {type: object, description: 地图定义；ABCD坐标，奇数行向右偏移半格}
        units:
          type: array
          items: {$ref: '#/components/schemas/Unit'}
        fleets:
          type: array
          description: 服务端按fleet_id生成的权威舰队投影，地图直接渲染此字段
          items: {$ref: '#/components/schemas/FleetGroup'}
        aviation: {$ref: '#/components/schemas/AviationView'}
        you: {$ref: '#/components/schemas/Player'}
        players:
          type: array
          items: {$ref: '#/components/schemas/Player'}
        orders:
          type: array
          items:
            type: object
            properties:
              type: {type: string}
              unit_id: {type: string}
              coord: {type: string}
        events:
          type: array
          items: {$ref: '#/components/schemas/Event'}
        join_token: {type: string, description: 仅房主可见}
        server_time: {type: string, format: date-time}

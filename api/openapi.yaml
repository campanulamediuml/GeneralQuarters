openapi: 3.0.3
info:
  title: General Quarters HTTP API
  version: 0.2.0
  description: |-
    大厅、健康检查和观战 token 解析接口。
    房间内的 state、events、commands、ready 与观战统一使用 WebSocket，不再提供 HTTP 接口。
    WebSocket RPC、快照和增量补丁契约见仓库根目录 API.md；OpenAPI 3.0 不描述这些帧协议。
servers:
  - url: /
tags:
  - name: System
  - name: Rooms
  - name: Spectator
paths:
  /healthz:
    get:
      tags: [System]
      summary: 健康检查
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, example: ok}
  /api/docs:
    get:
      tags: [System]
      summary: 在线 API 速查页
      responses:
        '200':
          description: HTML 文档
          content:
            text/html:
              schema: {type: string}
  /api/v1/openapi.yaml:
    get:
      tags: [System]
      summary: 下载 HTTP OpenAPI 定义
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema: {type: string}
  /api/v1/rooms:
    post:
      tags: [Rooms]
      summary: 创建房间并建立房主会话
      description: 成功后设置 HttpOnly Cookie gq_session。进入房间后使用该 Cookie 连接 /ws，房间内操作不再使用 HTTP。
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRoomRequest'}
      responses:
        '201':
          description: 创建成功
          headers:
            Set-Cookie:
              description: 玩家会话 Cookie
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoomResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/v1/rooms/join:
    post:
      tags: [Rooms]
      summary: 使用邀请 token 加入房间
      description: 成功后加入剩余阵营并设置独立的 gq_session Cookie；响应不返回 join_token。进入房间后使用该 Cookie 连接 /ws。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JoinRoomRequest'}
      responses:
        '200':
          description: 加入成功
          headers:
            Set-Cookie:
              description: 玩家会话 Cookie
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoomResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/v1/watch/{token}:
    get:
      tags: [Spectator]
      summary: 将观战 token 解析为房间 ID
      description: 取得 room_id 后连接 /ws?mode=spectator，并用 room_id 和同一 token 订阅。观战快照与补丁不经过 HTTP。
      parameters:
        - name: token
          in: path
          required: true
          description: 12 位邀请 token，可带显示用连字符
          schema: {type: string, example: 7K4M-9Q2X-6T8P}
      responses:
        '200':
          description: 解析成功
          content:
            application/json:
              schema:
                type: object
                required: [room_id]
                properties:
                  room_id: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  responses:
    BadRequest:
      description: 请求、未知字段或业务条件无效
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: 房间、接口或 token 不存在
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalServerError:
      description: 状态或数据库内部错误
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string, example: 请求JSON无效}
        error_code: {type: string}
        error_params:
          type: object
          additionalProperties: {type: string}
    CreateRoomRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, example: 玩家A}
        scenario_id: {type: string, enum: [_coral_real, _marianas], default: _coral_real}
        faction: {type: string, enum: [A, B], default: A}
        solo: {type: boolean, default: false, description: true 为单人沙盒，false 为双人房}
    JoinRoomRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, example: 7K4M-9Q2X-6T8P}
        name: {type: string, example: 玩家B}
    RoomResponse:
      type: object
      required: [room_id, player_id]
      properties:
        room_id: {type: string}
        player_id: {type: string}
        join_token: {type: string, description: 仅创建房间响应返回}
